max_side: 512
margin_ratio: 0.1
selection_metric: mean_folder_f1
review_all_candidates: true
# Retained anchors: previous candidates 0, 1, 3 become candidates 0, 1, 2.
low_ratios: [0.40]
background_kernels: [15]
minimum_areas: [128]
extra_candidates:
  - {low_ratio: 0.40, background_kernel_size: 31, min_component_area: 128}
  - {low_ratio: 0.50, background_kernel_size: 15, min_component_area: 128}
  # One-parameter neighbors of 0.40 / 15 / 128.
  - {low_ratio: 0.35, background_kernel_size: 15, min_component_area: 128}
  - {low_ratio: 0.40, background_kernel_size: 11, min_component_area: 128}
  - {low_ratio: 0.40, background_kernel_size: 15, min_component_area: 160}
  # One-parameter neighbors of 0.40 / 31 / 128.
  - {low_ratio: 0.35, background_kernel_size: 31, min_component_area: 128}
  - {low_ratio: 0.40, background_kernel_size: 27, min_component_area: 128}
  - {low_ratio: 0.40, background_kernel_size: 31, min_component_area: 160}
  # One-parameter neighbors of 0.50 / 15 / 128.
  - {low_ratio: 0.45, background_kernel_size: 15, min_component_area: 128}
  - {low_ratio: 0.50, background_kernel_size: 11, min_component_area: 128}
  - {low_ratio: 0.50, background_kernel_size: 15, min_component_area: 160}
