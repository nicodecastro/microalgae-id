# ==========================
# Training dataset configuration
# ==========================
dataset:
  raw_dir: "data/raw"
  features_dir: "data/features"
  combined_features_dir: "data/combined_features"
  image_format: [".png",".jpg"]
  grayscale: true
  classes: ["m_aeruginosa", "n_fruticosa", "n_palea"]

# ==========================
# Preprocessing
# ==========================
preprocessing:
  resize:
    enabled: true
    target_size: [256, 256]
    padding_color: "black"   # black | mean

  filter:
    enabled: true
    method: "bilateral"
    bilateral:
      params: [7, 25, 7]   # diameter, sigma_color, sigma_space

  threshold:
    enabled: true
    method: "adaptive"

  segment:
    enabled: true
    method: "canny"     # "sobel", "canny"

# ==========================
# Feature extraction
# ==========================
features:
  feature_list: ["efd", "gabor", "geom", "glcm", "hu", "lbp", "pc"]

# ==========================
# Experiment setup
# ==========================
experiment:
  cross_validation: "5-fold"
  # save_features: true
  # save_model: true
  results_dir: "results"

# ==========================
# Logging
# ==========================
logging:
  save_intermediate_images: false
