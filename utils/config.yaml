# ==========================
# Dataset configuration
# ==========================
dataset:
  raw_dir: "data/raw"
  features_dir: "data/features"
  image_format: [".png",".jpg"]
  grayscale: true
  classes: ["m_aeruginosa", "n_fruticosa", "n_palea"]

# ==========================
# Preprocessing
# ==========================
preprocessing:
  resize:
    enabled: true
    target_size: [512, 512]
    padding_color: "black"   # black | mean

  filter:
    enabled: true
    method: "bilateral"
    bilateral:
      params: [40, 1, 25]   # diameter, sigma_color, sigma_space

  threshold:
    enabled: false
    method: "adaptive"

  segment:
    enabled: false
    method: "sobel"     # "sobel", "canny"

# ==========================
# Feature extraction
# ==========================
features:
  feature_list: ["efd", "gabor", "geom", "glcm", "hu", "lbp", "pc"]

# ==========================
# Logging
# ==========================
logging:
  save_intermediate_images: true
